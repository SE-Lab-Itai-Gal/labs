hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
# The database is created automatically if it does not exist yet (createDatabaseIfNotExist=true).
hibernate.connection.url=jdbc:mysql://localhost:3306/myFirstDataBase?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
hibernate.connection.username=root
# Default password. Each user can override it at runtime (see App.applyCredentials),
# so there is no need to edit this file to make the connection work.
hibernate.connection.password=password
hibernate.show_sql=true
# Drop and recreate the tables on every run, so every grader gets the same fresh data.
hibernate.hbm2ddl.auto=create
